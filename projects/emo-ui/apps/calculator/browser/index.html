<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <style>
    /* The page is the web's own half of the calculator. A Style says
       layout and nothing about color, type or a panel, so the card, its
       paper and the key font are said here, in the page the bundle
       mounts into; the tree's own boxes fill the card below. */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f2f2f7;
      font-size: 18px;
    }
    #emo-root {
      width: 240px;
      padding: 16px;
      border-radius: 16px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }
    #emo-root button {
      font: inherit;
    }
  </style>
</head>
<body>
  <div id="emo-root"></div>
  <script src="out.js"></script>
</body>
</html>
