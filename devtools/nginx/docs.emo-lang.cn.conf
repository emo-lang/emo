# docs.emo-lang.cn — the static language tour.
#
# One-time setup on the server (DNS first: an A record for docs
# pointing at this host, then):
#
#   sudo cp /path/to/docs.emo-lang.cn.conf /etc/nginx/sites-available/docs.emo-lang.cn
#   sudo ln -sfn /etc/nginx/sites-available/docs.emo-lang.cn /etc/nginx/sites-enabled/docs.emo-lang.cn
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d docs.emo-lang.cn      # adds the 443 block + redirect
#
# The static root is written by devtools/publish-docs.sh:
#   /var/www/docs.emo-lang.cn/static
#
server {
    listen 80;
    listen [::]:80;
    server_name docs.emo-lang.cn;

    root /var/www/docs.emo-lang.cn/static;
    index index.html;

    # the tour is one guide; the roots point at it
    location = / { return 302 /guides/tour/; }
    location = /index.html { return 302 /guides/tour/; }
    location = /guides/ { return 302 /guides/tour/; }
    location = /zh/ { return 302 /zh/guides/tour/; }
    location = /zh/index.html { return 302 /zh/guides/tour/; }
    location = /zh/guides/ { return 302 /zh/guides/tour/; }
    location = /tour.md { return 302 /guides/tour/tour.md; }
    location = /guides/emo-ui/intro/ { return 301 /guides/emo-ui/intro; }
    location = /zh/guides/emo-ui/intro/ { return 301 /zh/guides/emo-ui/intro; }
    location = /zh/tour.md { return 302 /zh/guides/tour/tour.md; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # the authored Markdown rides beside each page ("source")
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location ~* \.(css|js|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
