name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "test/**"
      - "examples/**"
      - "dune-project"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.5.0"]
    runs-on: ${{ matrix.os }}
    # A hung test suite should fail the job quickly, not run to the
    # 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install -y dune cmdliner alcotest eio_main ssl yojson digestif

      # The riscv64 goldens boot the freestanding ELF under QEMU (T22.4);
      # on macOS the group skips gracefully — the cross binutils would
      # need a brew install per run.
      - name: Install riscv64 QEMU and cross binutils
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-unknown-elf

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test
