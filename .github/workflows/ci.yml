name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "test/**"
      - "examples/**"
      # stdlib/registry is embedded into the compiler at build time
      # (src/emo_pkg/dune) and tests diff embedded vs. filesystem.
      - "stdlib/**"
      # runtime/wasm and bin/ have their own dune files and join the
      # default build target defined by the root dune file.
      - "runtime/**"
      - "bin/**"
      - "dune"
      - "dune-project"
      # Generated from dune-project, but CI installs dependencies from
      # it, so a stale committed copy must trigger a run too.
      - "emo.opam"
      # Generator for the embedded stdlib data (src/emo_pkg/dune rule).
      - "devtools/gen-stdlib-data.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.5.0"]
    runs-on: ${{ matrix.os }}
    # A hung test suite should fail the job quickly, not run to the
    # 6-hour default.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      # Dependencies come from the committed opam file (generated from
      # dune-project), not a hand-maintained list, so the two cannot
      # drift apart. --with-test pulls in alcotest for dune test.
      - name: Install dependencies
        run: opam install . --deps-only --with-test -y

      # The riscv64 goldens boot the freestanding ELF under QEMU (T19.4);
      # on macOS the group skips gracefully — the cross binutils would
      # need a brew install per run.
      - name: Install riscv64 QEMU and cross binutils
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-unknown-elf

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test
