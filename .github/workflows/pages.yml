name: Deploy website

# Builds website/ and publishes it through GitHub Pages (Settings > Pages:
# Source = GitHub Actions — no gh-pages branch). The build copies the
# repository-root README.md and the docs/ tree into the site, so a README
# or docs change redeploys too.

on:
  push:
    branches: [develop]
    paths:
      - "website/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; a queued run waits rather than cancels,
# so a release is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # Match the version the lockfile and website/pnpm-workspace.yaml
          # (allowBuilds) are written for; pnpm 9 rejects that config with
          # "packages field missing or empty".
          version: 12.4.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        working-directory: website
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
